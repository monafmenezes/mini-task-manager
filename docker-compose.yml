services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  tasks-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasksdb
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    ports:
      - "5433:5432"
    volumes:
      - tasks-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasksdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./apps/auth-service
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: authdb
      DB_USER: auth
      DB_PASSWORD: auth
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    volumes:
      - ./apps/auth-service/keys:/app/keys:ro
    ports:
      - "8081:8081"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  tasks-service:
    build: ./apps/tasks-service
    depends_on:
      tasks-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: tasks-db
      DB_PORT: 5432
      DB_NAME: tasksdb
      DB_USER: tasks
      DB_PASSWORD: tasks
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./apps/tasks-service/keys:/app/keys:ro
    ports:
      - "8082:8082"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_AUTH_API_URL: http://localhost:8081
        VITE_TASKS_API_URL: http://localhost:8082
    depends_on:
      - auth-service
      - tasks-service
    ports:
      - "5173:80"

volumes:
  auth-db-data:
  tasks-db-data:
