name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/auth-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: authdb
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Gerar chaves RSA de teste
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -out keys/private.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -in keys/private.pem -pubout -out keys/public.pem
      - name: Rodar testes
        run: ./mvnw -B test

  tasks-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tasks-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tasksdb
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: tasks
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Gerar chave publica de teste
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -out /tmp/ci-private.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -in /tmp/ci-private.pem -pubout -out keys/public.pem
      - name: Rodar testes
        run: ./mvnw -B test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter web lint
      - name: Build
        run: pnpm --filter web build
